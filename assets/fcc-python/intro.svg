<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Animação de um terminal Python executando comandos do fcc-python" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg: #ffffff; --bar: #f6f8fa; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #3776ab; --out: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --bar: #161b22; --border: #30363d;
        --text: #e6edf3; --muted: #8b949e; --accent: #ffd43b; --out: #3fb950;
      }
    }
    .win   { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .bar   { fill: var(--bar); }
    .title { fill: var(--muted); font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .code  { font: 16px "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: var(--text); white-space: pre; }
    .prompt{ fill: var(--accent); font-weight: 700; }
    .out   { fill: var(--out); }
    .cover { fill: var(--bg); }
    .cursor{ fill: var(--accent); }

    #scene  { animation: fade 8s linear infinite; }
    .cov1   { transform-origin: 337.6px 0; animation: c1 8s linear infinite; }
    .cov2   { transform-origin: 443.2px 0; animation: c2 8s linear infinite; }
    .o1     { animation: o1 8s linear infinite; }
    .o2     { animation: o2 8s linear infinite; }
    .cursor { animation: cur 8s linear infinite; }

    @keyframes fade { 0%,87.5% { opacity: 1 } 97.5%,100% { opacity: 0 } }
    @keyframes c1 {
      0%,5%    { transform: scaleX(1); animation-timing-function: steps(31) }
      25%,100% { transform: scaleX(0) }
    }
    @keyframes c2 {
      0%,37.5%   { transform: scaleX(1); animation-timing-function: steps(42) }
      62.5%,100% { transform: scaleX(0) }
    }
    @keyframes o1 { 0%,27.4% { opacity: 0 } 27.5%,100% { opacity: 1 } }
    @keyframes o2 { 0%,64.9% { opacity: 0 } 65%,100%   { opacity: 1 } }
    @keyframes cur {
      0%,5%        { transform: translate(40px, 88px);     animation-timing-function: steps(31) }
      25%,27.3%    { transform: translate(337.6px, 88px);  animation-timing-function: linear }
      27.5%,37.5%  { transform: translate(40px, 144px);    animation-timing-function: steps(42) }
      62.5%,64.8%  { transform: translate(443.2px, 144px); animation-timing-function: linear }
      65%,100%     { transform: translate(78.4px, 200px) }
    }
  </style>

  <!-- janela -->
  <rect class="win" x="10" y="10" width="620" height="220" rx="10"/>
  <path class="bar" d="M10 46 V20 a10 10 0 0 1 10 -10 H620 a10 10 0 0 1 10 10 V46 Z"/>
  <circle cx="32" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="28" r="6" fill="#febc2e"/>
  <circle cx="72" cy="28" r="6" fill="#28c840"/>
  <text class="title" x="320" y="33" text-anchor="middle">exethew@fcc-python — python</text>

  <g id="scene">
    <!-- linha 1: comando -->
    <text class="code prompt" x="40" y="88" textLength="28.8" lengthAdjust="spacing">&gt;&gt;&gt;</text>
    <text class="code" x="78.4" y="88" textLength="259.2" lengthAdjust="spacing">print("Olá, freeCodeCamp!")</text>
    <!-- linha 2: saída -->
    <text class="code out o1" x="40" y="116" textLength="172.8" lengthAdjust="spacing">Olá, freeCodeCamp!</text>

    <!-- linha 3: comando -->
    <text class="code prompt" x="40" y="144" textLength="28.8" lengthAdjust="spacing">&gt;&gt;&gt;</text>
    <text class="code" x="78.4" y="144" textLength="364.8" lengthAdjust="spacing">len(["notes", "projects", "practice"])</text>
    <!-- linha 4: saída -->
    <text class="code out o2" x="40" y="172" textLength="9.6" lengthAdjust="spacing">3</text>
    <!-- linha 5: novo prompt -->
    <text class="code prompt o2" x="40" y="200" textLength="28.8" lengthAdjust="spacing">&gt;&gt;&gt;</text>

    <!-- máscaras que revelam a digitação -->
    <rect class="cover cov1" x="40" y="72" width="297.6" height="22"/>
    <rect class="cover cov2" x="40" y="128" width="403.2" height="22"/>

    <!-- cursor único e contínuo -->
    <rect class="cursor" x="0" y="-14" width="9" height="18"/>
  </g>
</svg>
